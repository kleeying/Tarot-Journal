<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Celestial Tarot Journal</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tarot Journal" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf.js for clean PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .pdf-entry {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- Header & API Key Modal Trigger -->
  <header class="flex justify-between items-center py-3 border-b border-slate-800">
    <div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-amber-200 bg-clip-text text-transparent">
        Celestial Tarot
      </h1>
      <p class="text-xs text-slate-400">Daily Journal & AI Insights</p>
    </div>
    <button onclick="openKeyModal()" class="px-3 py-1.5 bg-slate-800 border border-slate-700 text-xs text-amber-300 rounded-full font-medium active:scale-95 transition-transform">
      🔑 Key Status
    </button>
  </header>

  <!-- Main Content Area -->
  <main class="my-auto py-6 flex flex-col items-center text-center">
    
    <!-- Card Display Area -->
    <div id="cardContainer" class="w-48 h-80 bg-slate-800/80 border-2 border-dashed border-slate-700 rounded-2xl flex flex-col items-center justify-center p-4 shadow-xl mb-6 transition-all duration-300">
      <div id="cardPlaceholder" class="text-slate-500 flex flex-col items-center">
        <span class="text-4xl mb-2">🔮</span>
        <span class="text-sm font-medium">Draw your card for today</span>
      </div>
      <div id="cardContent" class="hidden w-full h-full flex flex-col justify-between">
        <div class="text-xs text-amber-400 uppercase tracking-widest font-semibold" id="cardArcana">Arcana</div>
        <div class="text-xl font-bold text-slate-100 my-auto" id="cardName">Card Name</div>
        <div class="text-xs text-slate-400 italic" id="cardKeywords">Keywords</div>
      </div>
    </div>

    <!-- Draw Button -->
    <button id="drawBtn" onclick="drawDailyCard()" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-purple-950/50 active:scale-98 transition-all mb-4">
      Draw Daily Card
    </button>

    <!-- AI Analysis Section -->
    <div id="analysisSection" class="w-full text-left bg-slate-800/50 border border-slate-700/50 rounded-xl p-4 hidden">
      <h2 class="text-sm font-semibold text-amber-300 mb-2 flex items-center gap-1.5">
        <span>✨</span> AI Insight (Gemini 2.5 Flash)
      </h2>
      <div id="analysisText" class="text-xs text-slate-300 leading-relaxed space-y-2 whitespace-pre-line">
        <!-- AI output renders here -->
      </div>
    </div>
  </main>

  <!-- Footer Actions -->
  <footer class="pt-4 border-t border-slate-800 flex justify-between gap-2">
    <button onclick="exportToPDF()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition-colors flex items-center justify-center gap-1">
      📥 Export PDF
    </button>
    <button onclick="clearJournalHistory()" class="px-3 py-2.5 bg-slate-900 hover:bg-red-950/40 text-red-400 text-xs font-semibold rounded-lg transition-colors">
      Clear
    </button>
  </footer>

  <!-- API Key Modal -->
  <div id="keyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-5 shadow-2xl">
      <h3 class="text-base font-bold text-slate-100 mb-1">Gemini API Key</h3>
      <p class="text-xs text-slate-400 mb-4">Saved locally on your iPhone only.</p>
      <input type="password" id="apiKeyInput" placeholder="Paste your AI key here..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-xs text-slate-100 focus:outline-none focus:border-purple-500 mb-4" />
      <div class="flex gap-2">
        <button onclick="closeKeyModal()" class="flex-1 py-2 bg-slate-800 text-slate-400 text-xs font-semibold rounded-lg">Cancel</button>
        <button onclick="saveApiKey()" class="flex-1 py-2 bg-purple-600 text-white text-xs font-semibold rounded-lg">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    // --- 78 Tarot Cards Data ---
    const tarotDeck = [
      { name: "The Fool", arcana: "Major Arcana", keywords: "Beginnings, innocence, spontaneity" },
      { name: "The Magician", arcana: "Major Arcana", keywords: "Manifestation, resourcefulness, power" },
      { name: "The High Priestess", arcana: "Major Arcana", keywords: "Intuition, sacred knowledge, subconscious" },
      { name: "The Empress", arcana: "Major Arcana", keywords: "Femininity, beauty, nature, abundance" },
      { name: "The Emperor", arcana: "Major Arcana", keywords: "Authority, structure, control, stability" },
      { name: "The Hierophant", arcana: "Major Arcana", keywords: "Spiritual wisdom, tradition, institutions" },
      { name: "The Lovers", arcana: "Major Arcana", keywords: "Love, harmony, relationships, choices" },
      { name: "The Chariot", arcana: "Major Arcana", keywords: "Control, willpower, success, action" },
      { name: "Strength", arcana: "Major Arcana", keywords: "Courage, persuasion, influence, compassion" },
      { name: "The Hermit", arcana: "Major Arcana", keywords: "Soul-searching, introspection, inner guidance" },
      { name: "Wheel of Fortune", arcana: "Major Arcana", keywords: "Good luck, karma, life cycles, destiny" },
      { name: "Justice", arcana: "Major Arcana", keywords: "Justice, fairness, truth, cause and effect" },
      { name: "The Hanged Man", arcana: "Major Arcana", keywords: "Surrender, letting go, new perspectives" },
      { name: "Death", arcana: "Major Arcana", keywords: "Endings, change, transformation, transition" },
      { name: "Temperance", arcana: "Major Arcana", keywords: "Balance, moderation, patience, purpose" },
      { name: "The Devil", arcana: "Major Arcana", keywords: "Shadow self, attachment, addiction, restriction" },
      { name: "The Tower", arcana: "Major Arcana", keywords: "Sudden change, upheaval, chaos, revelation" },
      { name: "The Star", arcana: "Major Arcana", keywords: "Hope, faith, purpose, renewal, inspiration" },
      { name: "The Moon", arcana: "Major Arcana", keywords: "Illusion, fear, anxiety, subconscious, intuition" },
      { name: "The Sun", arcana: "Major Arcana", keywords: "Positivity, fun, warmth, success, vitality" },
      { name: "Judgement", arcana: "Major Arcana", keywords: "Judgement, rebirth, inner calling, absolution" },
      { name: "The World", arcana: "Major Arcana", keywords: "Completion, integration, accomplishment, travel" }
    ];

    let journalData = {};
    let db;

    // --- IndexedDB Initialization ---
    const request = indexedDB.open("TarotJournalDB", 1);

    request.onupgradeneeded = function(event) {
      db = event.target.result;
      if (!db.objectStoreNames.contains("settings")) {
        db.createObjectStore("settings");
      }
      if (!db.objectStoreNames.contains("journal")) {
        db.createObjectStore("journal");
      }
    };

    request.onsuccess = function(event) {
      db = event.target.result;
      loadStoredData();
    };

    request.onerror = function(event) {
      console.error("IndexedDB error:", event.target.errorCode);
    };

    // --- Storage Helpers ---
    function loadStoredData() {
      const tx = db.transaction(["settings", "journal"], "readonly");
      const settingsStore = tx.objectStore("settings");
      const journalStore = tx.objectStore("journal");

      settingsStore.get("apiKey").onsuccess = function(e) {
        if (e.target.result) {
          document.getElementById("apiKeyInput").value = e.target.result;
        }
      };

      journalStore.get("history").onsuccess = function(e) {
        if (e.target.result) {
          journalData = e.target.result;
          checkTodayCard();
        }
      };
    }

    function saveJournalToDB() {
      const tx = db.transaction(["journal"], "readwrite");
      tx.objectStore("journal").put(journalData, "history");
    }

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      const tx = db.transaction(["settings"], "readwrite");
      tx.objectStore("settings").put(key, "apiKey");
      closeKeyModal();
      alert("API Key saved successfully!");
    }

    // --- Modal Logic ---
    function openKeyModal() {
      document.getElementById("keyModal").classList.remove("hidden");
    }
    function closeKeyModal() {
      document.getElementById("keyModal").classList.add("hidden");
    }

    // --- Core Card Logic ---
    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    function checkTodayCard() {
      const today = getTodayString();
      if (journalData[today]) {
        displayCard(journalData[today].card);
        displayAnalysis(journalData[today].analysis);
        document.getElementById("drawBtn").disabled = true;
        document.getElementById("drawBtn").innerText = "Card Drawn Today";
        document.getElementById("drawBtn").classList.add("opacity-50", "cursor-not-allowed");
      }
    }

    async function drawDailyCard() {
      const today = getTodayString();
      if (journalData[today]) return;

      const tx = db.transaction(["settings"], "readonly");
      tx.objectStore("settings").get("apiKey").onsuccess = async function(e) {
        const apiKey = e.target.result;
        if (!apiKey) {
          alert("Please enter your Gemini API Key first via Key Status.");
          openKeyModal();
          return;
        }

        const randomCard = tarotDeck[Math.floor(Math.random() * tarotDeck.length)];
        displayCard(randomCard);

        document.getElementById("drawBtn").disabled = true;
        document.getElementById("drawBtn").innerText = "Analyzing Card...";

        const analysis = await fetchGeminiAnalysis(apiKey, randomCard);
        
        journalData[today] = {
          card: randomCard,
          analysis: analysis
        };

        saveJournalToDB();
        displayAnalysis(analysis);

        document.getElementById("drawBtn").innerText = "Card Drawn Today";
        document.getElementById("drawBtn").classList.add("opacity-50", "cursor-not-allowed");
      };
    }

    function displayCard(card) {
      document.getElementById("cardPlaceholder").classList.add("hidden");
      document.getElementById("cardContent").classList.remove("hidden");
      document.getElementById("cardArcana").innerText = card.arcana;
      document.getElementById("cardName").innerText = card.name;
      document.getElementById("cardKeywords").innerText = card.keywords;
    }

    function displayAnalysis(text) {
      document.getElementById("analysisSection").classList.remove("hidden");
      document.getElementById("analysisText").innerText = text;
    }

    // --- Gemini 2.5 Flash-Lite API Call ---
    async function fetchGeminiAnalysis(apiKey, card) {
      const prompt = `Provide a concise 3-sentence daily tarot journal insight for today's drawn card: "${card.name}" (${card.keywords}). Keep the tone reflective, encouraging, and actionable.`;
      
      // Using gemini-2.5-flash-lite for higher rate limits and lower quota usage
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          return data.candidates[0].content.parts[0].text.trim();
        } else if (data.error) {
          console.error("Gemini API Error Detail:", data.error);
          return `API Error: ${data.error.message || "Check key status or quota limits."}`;
        } else {
          return "Card drawn successfully! Reflect on its keywords for guidance today.";
        }
      } catch (err) {
        console.error("Gemini API Error:", err);
        return "Insight unavailable right now. Focus on today's card keywords for reflection.";
      }
    }

    // --- Fixed PDF Export Function ---
    function exportToPDF() {
      const element = document.createElement('div');
      element.className = "p-6 bg-white text-gray-900";
      
      let htmlContent = `
        <div style="margin-bottom: 24px; border-bottom: 2px solid #064e3b; padding-bottom: 12px;">
          <h1 style="font-size: 24px; font-weight: bold; color: #064e3b; margin: 0;">Celestial Tarot - Journal History</h1>
          <p style="font-size: 12px; color: #047857; margin-top: 4px;">Exported on ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>
        </div>
      `;

      const sortedDates = Object.keys(journalData).sort().reverse();

      if (sortedDates.length === 0) {
        alert("No entries stored to export.");
        return;
      }

      sortedDates.forEach(dateStr => {
        const entry = journalData[dateStr];
        const dateObj = new Date(dateStr + "T00:00:00");
        const dayOfWeek = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
        const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        htmlContent += `
          <div class="pdf-entry" style="page-break-inside: avoid; break-inside: avoid; margin-bottom: 20px; padding: 16px; border: 1px solid #a7f3d0; border-radius: 12px; background-color: #f0fdf4;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px; margin-bottom: 12px;">
              <h3 style="font-size: 16px; font-weight: bold; color: #064e3b; margin: 0;">${formattedDate} (${dayOfWeek})</h3>
              <span style="font-size: 14px; font-weight: bold; color: #047857;">${entry.card.name}</span>
            </div>
            <div style="font-size: 12px; line-height: 1.6; color: #334155; white-space: pre-line; font-family: serif;">${entry.analysis}</div>
          </div>
        `;
      });

      element.innerHTML = htmlContent;
      
      const opt = {
        margin:       0.4,
        filename:     `tarot_journal_${new Date().toISOString().split('T')[0]}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
      };

      html2pdf().set(opt).from(element).save();
    }

    function clearJournalHistory() {
      if (confirm("Are you sure you want to clear your local journal history?")) {
        journalData = {};
        saveJournalToDB();
        location.reload();
      }
    }
  </script>
</body>
</html>
